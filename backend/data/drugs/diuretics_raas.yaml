    - {parameter: "K+, Na+, kreatinin", schedule_uz: "Boshlanganda va 1-2 haftadan so'ng"}
    - {parameter: "Vazn, AQB", schedule_uz: "Kundalik/muntazam"}
  adverse_effects: [{effect_uz: "Gipokaliemiya, gipotenziya, dehidratatsiya, ototoksiklik (yuqori dozada)"}]
  sources: [{type: guideline, name: "ESC Heart Failure Guidelines", year: 2021}]

- drug_id: spironolactone
  inn_en: spironolactone
  inn_uz: spironolakton
  atc_code: C03DA01
  class_group: diuretics
  drug_class: mineralocorticoid_antagonist
  interaction_classes: [mra, potassium_sparing]
  forms: [{form: tablet, strengths_mg: [25, 50, 100]}]
  enabled: true
  kb_status: draft
  indications:
    - {condition_code: heart_failure, min_condition_prob: 0.40, evidence_level: guideline, context_uz: "HFrEF (kam EF) tasdiqlangan bo'lsa"}
  doses:
    - {population: adult, indication_context: heart_failure, route: po, dose_min: 12.5, dose_max: 50, unit: mg, frequency: qd, max_daily: 50,
       titration_uz: "12.5-25 mg dan boshlab, K+/kreatinin nazoratida oshiriladi",
       renal_adjust: [{egfr_lt: 30, action: avoid, note_uz: "eGFR < 30 da boshlash tavsiya etilmaydi"}]}
  contraindications:
    - {kind: absolute, code: hyperkalemia, condition_expr: {field: potassium_mmol_l, op: ">", value: 5.0}, note_uz: "K+ > 5.0 mmol/l"}
    - {kind: absolute, code: egfr_lt_30, condition_expr: {field: egfr_ml_min, op: "<", value: 30}}
    - {kind: absolute, code: addison_disease}
    - {kind: relative, code: pregnancy, note_uz: "Homiladorlikda faqat shifokor qarori bilan"}
  monitoring: [{parameter: "K+, kreatinin", schedule_uz: "1 hafta, 4 hafta, keyin har 3-6 oyda"}]
  adverse_effects: [{effect_uz: "Giperkaliemiya, ginekomastiya, buyrak funksiyasi pasayishi"}]
  sources: [{type: guideline, name: "ESC Heart Failure Guidelines", year: 2021}]

