  inn_uz: azitromitsin
  atc_code: J01FA10
  class_group: antibiotic_prophylaxis
  drug_class: macrolide
  interaction_classes: [macrolides]
  forms: [{form: capsule, strengths_mg: [250, 500]}]
  enabled: true
  kb_status: draft
  indications:
    - {condition_code: infective_endocarditis, requires_flags_any: [prosthetic_valve, mechanical_valve, prior_infective_endocarditis, congenital_heart_disease_cyanotic],
       context_uz: "Penitsillinga allergiyada muqobil profilaktika; davolash emas", min_condition_prob: 0.0, evidence_level: guideline, dose_context: ie_prophylaxis}
