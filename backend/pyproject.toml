[project]
name = "cardiopcg-backend"
version = "1.0.0"
description = "CardioPCG AI backend core (FastAPI)"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "gunicorn>=23.0; sys_platform != 'win32'",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis>=5.2",
  "celery>=5.4",
  "argon2-cffi>=23.1",
  "pyjwt>=2.10",
  "cryptography>=43",
  "python-multipart>=0.0.17",
  "boto3>=1.35",
  "numpy>=2.1",
  "soundfile>=0.12.1",
  "pillow>=11",
  "httpx>=0.27",
  "structlog>=24.4",
  "uuid-utils>=0.9",
  "orjson>=3.10",
  "zxcvbn>=4.4.28",
  "tzdata>=2024.2",
  "reportlab>=4.2",
  "scipy>=1.14",
  "pyyaml>=6.0",
  "opencv-python-headless>=4.10",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
ml = ["onnxruntime>=1.19"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "testcontainers[postgres]>=4.8",
  "fakeredis>=2.26",
  "freezegun>=1.5",
]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM"]
ignore = ["B008", "ASYNC230", "ASYNC109", "SIM102", "S101", "S105", "S106", "E501", "B904", "S311", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"scripts/**" = ["S"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
