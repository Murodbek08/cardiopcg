# DEV/e2e only: serves the built SPA and proxies /api (REST, SSE, WebSocket) to the api container.
map $http_upgrade $dev_conn_upgrade { default upgrade; '' ''; }

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 55m;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dev_conn_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
