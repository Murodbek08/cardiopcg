# CardioPCG AI - LOCAL full stack for development and Playwright e2e. NOT for servers.
#   docker compose -f deploy/docker-compose.dev.yml up -d --build --wait
#   open http://localhost:8080   (frontend + same-origin /api proxy)
# Values below are throwaway local-development defaults (override via env); nothing here is a real secret.
name: cardiopcg-dev

x-dev-env: &dev-env
  APP_ENV: development
  PUBLIC_URL: http://localhost:${DEV_WEB_PORT:-8080}
  ALLOWED_ORIGINS: http://localhost:${DEV_WEB_PORT:-8080},http://127.0.0.1:${DEV_WEB_PORT:-8080}
  ALLOWED_HOSTS: "*"
  LOG_LEVEL: info
  DATABASE_URL: postgresql+asyncpg://cardiopcg:${DEV_DB_PASSWORD:-cardiopcg_dev}@postgres:5432/cardiopcg
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  JOB_RUNNER: celery
  STORAGE_BACKEND: s3
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${DEV_MINIO_USER:-cardiopcg-dev}
  S3_SECRET_KEY: ${DEV_MINIO_PASSWORD:-cardiopcg-dev-minio-pass}
  S3_BUCKET_AUDIO: pcg-audio
  S3_BUCKET_REPORTS: pcg-reports
  COOKIE_SECURE: "false"
  COOKIE_SAMESITE: lax
  # e2e logs in many times from one IP: relax throttles (development only)
  RATE_LIMIT_LOGIN_IP: "1000"
  RATE_LIMIT_LOGIN_USER: "1000"
  RATE_LIMIT_REFRESH_IP: "1000"
  RATE_LIMIT_API_USER: "5000"
  RATE_LIMIT_UPLOAD_USER: "500"
  RATE_LIMIT_AI_USER: "500"
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cardiopcg
      POSTGRES_USER: cardiopcg
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:-cardiopcg_dev}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:${DEV_PG_PORT:-55432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardiopcg -d cardiopcg"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${DEV_MINIO_USER:-cardiopcg-dev}
      MINIO_ROOT_PASSWORD: ${DEV_MINIO_PASSWORD:-cardiopcg-dev-minio-pass}
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: ../backend, dockerfile: Dockerfile, target: runtime }
    image: cardiopcg-dev/api:local
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: *dev-env
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: cardiopcg-dev/api:local
    environment: *dev-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    ports: ["127.0.0.1:${DEV_API_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/system/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  worker:
    image: cardiopcg-dev/api:local
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-l", "info", "-Q", "analysis,llm,default,exports", "--concurrency=2"]
    environment: *dev-env
    healthcheck:
      disable: true  # image HEALTHCHECK probes the API port
    depends_on:
      api: { condition: service_healthy }

  beat:
    image: cardiopcg-dev/api:local
    command: ["celery", "-A", "app.workers.celery_app", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    environment: *dev-env
    healthcheck:
      disable: true
    depends_on:
      api: { condition: service_healthy }

  # built SPA + same-origin /api proxy (incl. WebSocket/SSE) so cookies and CSP behave like production
  web:
    build: { context: .., dockerfile: deploy/frontend.Dockerfile }
    image: cardiopcg-dev/frontend:local
    ports: ["127.0.0.1:${DEV_WEB_PORT:-8080}:8080"]
    volumes: ["./frontend-nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  miniodata:
