# CardioPCG AI - PRODUCTION compose (shared server: strictly isolated).
# Run ONLY as:  docker compose -p cardiopcg -f deploy/docker-compose.prod.yml <cmd>
# Ports bind to 127.0.0.1 only. 18400-18409 is a PLACEHOLDER range: confirm it with deploy/scripts/recon.sh
# and override CARDIOPCG_API_PORT / CARDIOPCG_WEB_PORT in deploy/.env if any of them is taken.
name: cardiopcg

x-common: &common
  restart: unless-stopped
  labels: ["project=cardiopcg"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
  security_opt: ["no-new-privileges:true"]
  networks: [cardiopcg_net]

# Connection strings are derived from the single-source variables (use hex/alphanumeric passwords only).
x-app-env: &app-env
  APP_ENV: production
  APP_VERSION: ${APP_VERSION:-latest}
  GIT_COMMIT: ${GIT_COMMIT:-unknown}
  JOB_RUNNER: celery
  STORAGE_BACKEND: s3
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
  S3_ENDPOINT: http://minio:9000
  TZ: ${TZ:-Asia/Tashkent}

services:
  postgres:
    <<: *common
    image: postgres:17-alpine
    container_name: cardiopcg-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      TZ: ${TZ:-Asia/Tashkent}
    volumes: ["cardiopcg_pgdata:/var/lib/postgresql/data"]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
    # no ports: internal network only

  redis:
    <<: *common
    image: redis:7-alpine
    container_name: cardiopcg-redis
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --maxmemory 200mb --maxmemory-policy noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env}
    volumes: ["cardiopcg_redis:/data"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 6

  minio:
    <<: *common
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    container_name: cardiopcg-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in deploy/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in deploy/.env}
    volumes: ["cardiopcg_minio:/data"]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 200
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    # no ports; console only through a temporary SSH tunnel

  # one-shot: creates the private buckets and a least-privilege application user for the API/worker
  minio-init:
    <<: *common
    restart: "no"
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}   # same image: it ships the `mc` client
    container_name: cardiopcg-minio-init
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in deploy/.env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in deploy/.env}
      S3_BUCKET_AUDIO: ${S3_BUCKET_AUDIO:-pcg-audio}
      S3_BUCKET_REPORTS: ${S3_BUCKET_REPORTS:-pcg-reports}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb --ignore-existing "local/$$S3_BUCKET_AUDIO" "local/$$S3_BUCKET_REPORTS"
        mc anonymous set none "local/$$S3_BUCKET_AUDIO"
        mc anonymous set none "local/$$S3_BUCKET_REPORTS"
        cat > /tmp/policy.json <<POLICY
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:*"],"Resource":["arn:aws:s3:::$$S3_BUCKET_AUDIO","arn:aws:s3:::$$S3_BUCKET_AUDIO/*","arn:aws:s3:::$$S3_BUCKET_REPORTS","arn:aws:s3:::$$S3_BUCKET_REPORTS/*"]}]}
        POLICY
        mc admin policy create local cardiopcg-app /tmp/policy.json
        mc admin user add local "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" || true
        mc admin policy attach local cardiopcg-app --user "$$S3_ACCESS_KEY" || true
        echo "minio-init done"
    mem_limit: 128m
    cpus: 0.25

  # one-shot: alembic migrations (api waits for it)
  migrate:
    <<: *common
    restart: "no"
    build: { context: ../backend, dockerfile: Dockerfile, target: runtime, labels: ["project=cardiopcg"] }
    image: cardiopcg/api:${APP_VERSION:-latest}
    container_name: cardiopcg-migrate
    command: ["alembic", "upgrade", "head"]
    env_file: [.env]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 100
    cap_drop: [ALL]

  api:
    <<: *common
    build: { context: ../backend, dockerfile: Dockerfile, target: runtime, labels: ["project=cardiopcg"] }
    image: cardiopcg/api:${APP_VERSION:-latest}
    container_name: cardiopcg-api
    env_file: [.env]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    ports: ["127.0.0.1:${CARDIOPCG_API_PORT:-18400}:8000"]
    read_only: true
    tmpfs: ["/tmp:size=256m"]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 300
    cap_drop: [ALL]
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/system/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    <<: *common
    image: cardiopcg/api:${APP_VERSION:-latest}
    container_name: cardiopcg-worker
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-l", "info", "-Q", "analysis,llm,default,exports", "--concurrency=2", "--max-tasks-per-child=50"]
    env_file: [.env]
    environment: *app-env
    depends_on:
      api: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp:size=512m"]
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 300
    cap_drop: [ALL]
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout 8 | grep -q pong"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s

  beat:
    <<: *common
    image: cardiopcg/api:${APP_VERSION:-latest}
    container_name: cardiopcg-beat
    command: ["celery", "-A", "app.workers.celery_app", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    env_file: [.env]
    environment: *app-env
    depends_on:
      redis: { condition: service_healthy }
      api: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 100
    cap_drop: [ALL]
    healthcheck:
      disable: true  # the image HEALTHCHECK probes the API port, which beat does not serve

  frontend:
    <<: *common
    build: { context: .., dockerfile: deploy/frontend.Dockerfile, labels: ["project=cardiopcg"] }
    image: cardiopcg/frontend:${APP_VERSION:-latest}
    container_name: cardiopcg-frontend
    ports: ["127.0.0.1:${CARDIOPCG_WEB_PORT:-18401}:8080"]
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx", "/var/run"]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 50
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  # optional antivirus: docker compose -p cardiopcg -f deploy/docker-compose.prod.yml --profile av up -d clamav
  # then set CLAMAV_HOST=clamav and CLAMAV_REQUIRED=true in deploy/.env
  clamav:
    <<: *common
    profiles: ["av"]
    image: clamav/clamav:1.4
    container_name: cardiopcg-clamav
    volumes: ["cardiopcg_clamav:/var/lib/clamav"]
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 200

networks:
  cardiopcg_net:
    name: cardiopcg_net
    driver: bridge

volumes:
  cardiopcg_pgdata: { name: cardiopcg_pgdata }
  cardiopcg_redis: { name: cardiopcg_redis }
  cardiopcg_minio: { name: cardiopcg_minio }
  cardiopcg_clamav: { name: cardiopcg_clamav }
